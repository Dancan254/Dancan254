<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Ian Dancan Mongare — Applied AI Engineer, Backend Engineer, Java Instructor. Nairobi, Kenya.">
  <title>Ian Dancan Mongare — Applied AI Engineer, Backend Engineer</title>

  <style>
    .sans { font-family: 'Bricolage Grotesque', 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', Menlo, 'DejaVu Sans Mono', Consolas, monospace; }

    .glow { animation: breathe 7s ease-in-out infinite }
    @keyframes breathe {
      0%, 100% { opacity: .55 }
      50%      { opacity: 1 }
    }

    /* Roles crossfade — deliberately not a typewriter; this variant is not a terminal. */
    @keyframes r1 { 0% {opacity:0} 4% {opacity:1} 29% {opacity:1} 33% {opacity:0} 100% {opacity:0} }
    @keyframes r2 { 0%,33% {opacity:0} 37% {opacity:1} 62% {opacity:1} 66% {opacity:0} 100% {opacity:0} }
    @keyframes r3 { 0%,66% {opacity:0} 70% {opacity:1} 95% {opacity:1} 99% {opacity:0} 100% {opacity:0} }
    .r1 { animation: r1 12s ease-in-out infinite }
    .r2 { animation: r2 12s ease-in-out infinite }
    .r3 { animation: r3 12s ease-in-out infinite }

    .orb { transform-box: view-box; transform-origin: 832px 150px; }
    @keyframes spin    { to { transform: rotate(360deg) } }
    @keyframes spinrev { to { transform: rotate(-360deg) } }
    .o1 { animation: spin 14s linear infinite }
    .o2 { animation: spinrev 22s linear infinite }
    .o3 { animation: spin 34s linear infinite }

    .core { transform-box: fill-box; transform-origin: center; animation: pulse 3.5s ease-in-out infinite }
    @keyframes pulse {
      0%, 100% { transform: scale(1);    opacity: 1 }
      50%      { transform: scale(1.18); opacity: .75 }
    }

    @media (prefers-reduced-motion: reduce) {
      .glow, .r1, .r2, .r3, .o1, .o2, .o3, .core { animation: none }
      .r1, .r2 { opacity: 0 }
      .r3 { opacity: 1 }
    }
  </style>

  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2e2e4a"/>
    </pattern>

    <radialGradient id="glowGrad">
      <stop offset="0"   stop-color="#f0196a" stop-opacity=".38"/>
      <stop offset="0.6" stop-color="#f0196a" stop-opacity=".10"/>
      <stop offset="1"   stop-color="#f0196a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-280" y1="0" x2="40" y2="0">
      <stop offset="0"    stop-color="#FFFFFF"/>
      <stop offset="0.42" stop-color="#FFFFFF"/>
      <stop offset="0.5"  stop-color="#ff6b9d"/>
      <stop offset="0.58" stop-color="#FFFFFF"/>
      <stop offset="1"    stop-color="#FFFFFF"/>
      <animate attributeName="x1" values="-280;780" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="40;1100"  dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <clipPath id="card"><rect x="0" y="0" width="1000" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="#12121f"/>
    <rect width="1000" height="300" fill="url(#dots)" opacity=".55"/>
    <circle class="glow" cx="210" cy="150" r="270" fill="url(#glowGrad)"/>

    <g class="orb o3" opacity=".45">
      <circle cx="832" cy="150" r="96" fill="none" stroke="#2e2e4a" stroke-width="1"/>
      <circle cx="832" cy="54"  r="3" fill="#6B7A99"/>
    </g>
    <g class="orb o2" opacity=".7">
      <circle cx="832" cy="150" r="70" fill="none" stroke="#2e2e4a" stroke-width="1.2"/>
      <circle cx="902" cy="150" r="4" fill="#ff6b9d"/>
    </g>
    <g class="orb o1">
      <circle cx="832" cy="150" r="44" fill="none" stroke="#2e2e4a" stroke-width="1.5"/>
      <circle cx="832" cy="106" r="5" fill="#f0196a"/>
    </g>
    <circle class="core" cx="832" cy="150" r="15" fill="#f0196a"/>
  </g>

  <text class="sans" x="70" y="152" font-size="60" font-weight="700" fill="url(#shine)">Ian Dancan Mongare</text>

  <g>
    <text class="sans r1" x="72" y="198" font-size="25" font-weight="500" fill="#ff6b9d">Applied AI Engineer</text>
    <text class="sans r2" x="72" y="198" font-size="25" font-weight="500" fill="#ff6b9d">Backend Engineer</text>
    <text class="sans r3" x="72" y="198" font-size="25" font-weight="500" fill="#ff6b9d">Java Instructor</text>
  </g>

  <text class="mono" x="72" y="236" font-size="14" fill="#6B7A99">Nairobi, Kenya  ·  Kenya Java User Group  ·  @your_javaguy</text>

  <rect x="0.5" y="0.5" width="999" height="299" rx="18" fill="none" stroke="#2e2e4a" stroke-width="1"/>
</svg>
